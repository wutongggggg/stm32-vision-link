; PlatformIO 工程：无需 Keil / CubeMX，无需 ST-Link
; 编译：pio run
; 串口下载：USB 线插【核心板】MicroUSB（不是板上 USB1），pio run -t upload --upload-port COM3
; 洋桃1号自带 ASP 自动下载；若 PlatformIO 不触发，用 FlyMcu 打开 build_out/firmware.hex
[platformio]
src_dir = Src
include_dir = Inc

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = stm32cube
upload_protocol = serial
upload_port = COM3
monitor_speed = 115200
build_flags =
    -DUSE_HAL_DRIVER
    -DSTM32F103xB
