# Vision-Link PC 端配置
source:
  type: camera          # camera（采集卡/摄像头）| video（视频文件）
  index: 1              # 1 = 采集卡（USB Video，名称见 list_cameras.py）；0 = 笔记本自带摄像头
  path: ""              # type=video 时填视频路径
  width: 1280
  height: 720           # 默认 720p 保证舵机跟随流畅；采集卡 1080p 已验证，改 1920x1080 即可
  fourcc: MJPG          # 1080p 必须设 MJPG，否则 UVC 可能只给 720p/低帧率
  fps: 30

detector:
  backend: yolo         # yolo | face | motion
  model: yolov8n.pt     # 首次运行会自动下载（约 6MB）
  conf: 0.35
  imgsz: 320            # CPU 上 320 更快，演示够用；要精度改回 640
  device: cpu           # 有 NVIDIA 显卡可改 cuda:0

serial:
  enabled: true
  port: COM3            # 设备管理器 → USB-SERIAL CH340 (COMx)
  baud: 115200
